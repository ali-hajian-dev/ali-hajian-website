Context Routing","Vision"]},{id:"agents",name:"AI Agents",desc:"Building agentic workflows that plan, act and review: multi-step pipelines from idea understanding to coding, testing, debugging and delivery.",tags:["Planning","Tool Use","Multi-step Flows","Review Loops"]},{id:"web",name:"Web Development",desc:"Modern, performant web apps with a focus on interaction quality, clean architecture and production-ready code.",tags:["React","TypeScript","Node","APIs"]},{id:"uiux",name:"UI/UX Design",desc:"Interfaces that feel designed, not assembled: typography, hierarchy, motion and states that guide instead of decorate.",tags:["Interface Design","Design Systems","Prototyping"]},{id:"automation",name:"Automation",desc:"Removing repetitive work: bots, pipelines and systems that handle users, content and operations automatically.",tags:["Bots","Pipelines","Scheduling","Integrations"]},{id:"programming",name:"Programming",desc:"Strong engineering fundamentals across languages and platforms \u2014 from Python bots to full web applications.",tags:["Python","JavaScript","Data Modeling","Testing"]},{id:"creative",name:"Creative Development",desc:"Interactive and generative experiences: canvas, WebGL, shaders and motion that make a product memorable.",tags:["Canvas","WebGL","Motion","Generative"]},{id:"product",name:"Product Development",desc:"From fuzzy idea to MVP: scoping, architecture, build, test and iteration \u2014 owning the whole lifecycle.",tags:["MVP","Architecture","Iteration","Launch"]}]},projects:{label:"PROJECTS",index:"03",title:"Real work. Honest status.",note:"No inflated numbers, no fake clients. Each project is labeled exactly as it is.",problem:"Problem",approach:"Approach",stack:"Concepts & Tools",status:"Status",type:"Type",items:[{id:"ario",title:"Ario",subtitle:"AI Bot for Bale",type:"AI-powered conversational product",status:"Personal Project",statusTone:"live",desc:"A conversational AI bot on the Bale messenger with a full product layer around the chat i he model, cutting unnecessary context.",tags:["Education","Content Extraction","Question Generation","Vision Check","Context Routing","Print Output"]},{id:"raimand",title:"Raimand",subtitle:"Digital products studio",type:"Brand \u2014 AI, web & interactive products",status:"In Development",statusTone:"dev",desc:"A brand and workshop for building digital products and experiences with a focus on AI, the web and interactive media.",problem:"A home for products and experiments that go beyond single projects \u2014 an identity for continuous building.",approach:"Developing Raimand as an umbrella for AI-powered products, web experiences and interactive work. Details will be published as the brand takes shape.",tags:["Brand","AI Products","Web","Interactive"]},{id:"autocad",title:"AI AutoCAD / DXF Agent",subtitle:"AI meets architectural drawings",type:"AI + CAD experiment",status:"Experiment / Concept",statusTone:"concept",desc:"An experiment in using AI to analyze and modify architectural CAD/DXF drawings in a hybrid workflow.",problem:"Reviewing and editing technical drawings is slow, repetitive and error-prone.",approach:"AI analyzes the drawing, detects issues, proposes changes, edits the DXF file and verifies the output \u2014 using Vision for visual checks. Outputs are experimental and carry no engineering certification.",tags:["CAD / DXF","Analysis","Vision","File Editing","Hybrid Workflow"]},{id:"web-lab",title:"Interactive Web Lab",subtitle:"UI & WebGL experiments",type:"Creative development playground",status:"Ongoing",statusTone:"live",desc:"A living lab of interactive websites, animated interfaces, 3D and WebGL experiences and AI-powered pages.",problem:"The best way to learn what the web can feel like is to keep building things it hasn't felt like yet.",approach:"Continuous experiments in motion, generative graphics and interaction \u2014 including this very site.",tags:["Interactive Sites","3D / WebGL","Motion","Generative","AI-powered Pages"]}]},build:{label
